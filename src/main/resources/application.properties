spring.application.name=KHMTOMNENH
# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/khmertrade?currentSchema=public
spring.datasource.username=chengsenghab
spring.datasource.password=11112222
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=true

# Server
server.port=8080

# Logging
logging.level.org.springframework=INFO
logging.level.org.hibernate=DEBUG

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.schemas=public
spring.flyway.default-schema=public

# JWT Configuration
app.jwt.secret=change-this-to-a-long-32-plus-character-secret-key
app.jwt.expiration-ms=86400000
