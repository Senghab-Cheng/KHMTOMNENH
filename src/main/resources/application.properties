spring.application.name=KHMTOMNENH
# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/khmertrade?currentSchema=public
spring.datasource.username=${DB_USERNAME:chengsenghab}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.password=11112222
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=true

# Server
server.port=8080

# Logging
logging.level.org.springframework=INFO
logging.level.org.hibernate=DEBUG

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.schemas=public
spring.flyway.default-schema=public

# JWT Configuration
# Override this in production with JWT_SECRET. The fallback keeps local development
# runnable when the environment file has not been created yet.
app.jwt.secret=${JWT_SECRET:foodfarm-hub-local-development-secret-change-me-2026}
# Local PostgreSQL commonly uses passwordless peer/trust authentication. Set
# DB_PASSWORD explicitly for installations that require a password.
spring.datasource.password=${DB_PASSWORD:}
app.jwt.expiration-ms=86400000
